name: Screener autonome - screening et prevalorisations
on:
  workflow_dispatch:
  schedule:
    - cron: "15 23 * * *"
      timezone: "Europe/Paris"
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "refresh.py"
      - "valuation_engine.py"
      - "valuation_sources.py"
      - "build_valuations.py"
      - "valuation_assumptions.csv"
      - "tests/**"
      - "requirements.txt"
      - "universe.csv"
      - "research.csv"
      - "index.html"
      - "valorisations.html"
      - "research/**"
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: screener-quality-value-autonome
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Validate valuation computations
        run: python -m pytest -q tests/test_valuation_engine.py tests/test_dcf_transparency.py
      - name: Refresh screener
        run: python refresh.py
      - name: Refresh financial histories and create valuations
        run: python build_valuations.py
      - name: Validate screens, sources and valuation outputs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          screen=json.loads(Path('data/snapshot.json').read_text(encoding='utf-8'))
          values=json.loads(Path('data/models.json').read_text(encoding='utf-8'))
          sreport=json.loads(Path('data/run_report.json').read_text(encoding='utf-8'))
          report=json.loads(Path('data/valuation_run_report.json').read_text(encoding='utf-8'))
          html=Path('index.html').read_text(encoding='utf-8')
          page=Path('valorisations.html').read_text(encoding='utf-8')
          assert screen['coverage_count']==len(screen['companies'])>0
          assert values['universe_count']==len(values['models'])==len(screen['companies'])
          assert sreport['universe_count']==screen['coverage_count']
          assert report['companies']==values['universe_count']
          assert all(x.get('triage',{}).get('status') for x in screen['companies'])
          assert all('screening_evidence' in x for x in values['models'])
          assert all(len(s.get('projection',[]))==10 for x in values['models'] for s in x.get('scenarios',{}).values())
          assert all(x.get('validation')=='Aucune recommandation' for x in values['models'])
          assert all(x['status']!='prévalorisation_indicative' or x.get('scenarios',{}).get('central') for x in values['models'])
          assert 'const embedded={' in html and 'valorisations.html' in html
          assert 'models.json' in page and 'simulationResult' in page
          print('Screener:',len(screen['companies']),'Valorizations:',report['indicative_models'],'Other:',report['sector_blocked']+report['without_model'])
          PY
      - name: Commit data and audit trail
        run: |
          git config user.name "quality-value-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html data/snapshot.json data/run_report.json data/models.json data/financial_history.json data/valuation_run_report.json
          if ! git diff --cached --quiet; then
            git commit -m "Screener: cours et prevalorisations actualises [skip ci]"
            git push
          fi
      - name: Build public output
        run: |
          mkdir -p public
          cp index.html public/index.html
          cp valorisations.html public/valorisations.html
          cp data/run_report.json public/rapport.json
          cp data/snapshot.json public/instantane.json
          cp data/models.json public/models.json
          cp data/valuation_run_report.json public/rapport-valorisations.json
          cp -R research public/research
          touch public/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
